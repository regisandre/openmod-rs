name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny 0.20.2
        run: |
          curl -fsSL -o cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          ./cargo-deny check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t openmod .
      - name: The image starts, writes its configuration and answers
        run: |
          docker run -d --name openmod -p 8088:8088 -p 127.0.0.1:8089:8089 openmod
          for i in $(seq 30); do curl -sf http://127.0.0.1:8088/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8088/health | grep -q '"status"'
          curl -sf -o /dev/null http://127.0.0.1:8089/
          docker exec openmod test -f /data/openmod.toml
          docker logs openmod 2>&1 | grep -q "admin token"
