name: release

# Pushing a tag such as v0.2.0 builds the Linux binary and attaches it, with
# its SHA-256, to a GitHub release of the same name, and publishes the Docker
# image as ghcr.io/<owner>/openmod-rs:<version> and :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    # The prebuilt ONNX Runtime needs glibc 2.38+ and the libstdc++ of GCC 13+,
    # so the binary runs on Ubuntu 24.04, Debian 13 and later.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="openmod-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/openmod README.md LICENSE NOTICE openmod.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes openmod-*.tar.gz openmod-*.tar.gz.sha256

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
