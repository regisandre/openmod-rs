# openmod configuration. Paths are relative to this file.
# Thresholds are starting points: calibrate them on your own content with
# `openmod eval` before relying on them.

[server]
bind = "127.0.0.1:8088"
max_upload_bytes = 15_728_640
max_image_pixels = 50_000_000
max_text_chars = 20_000
max_concurrent = 2
threads_per_model = 2
# API keys: OPENMOD_API_KEYS="key1,key2", one key per line in this file, or
# the keys created in the admin interface (kept in `state_file`).
# api_keys_file = "/etc/openmod/keys"
allow_unauthenticated = false
# The admin token and the API keys of the admin interface, as digests only.
state_file = "openmod-state.toml"
# How often the domain lists are downloaded again, if they changed; 0 never.
lists_refresh_hours = 24

# The admin web interface, on its own port. Keep it on loopback and reach it
# through an SSH tunnel or an HTTPS reverse proxy.
[admin]
enabled = true
bind = "127.0.0.1:8089"

# ---------------------------------------------------------------- models

# Marqo ViT-tiny NSFW classifier (5.6M params, Apache-2.0).
[models.marqo_nsfw]
kind = "image_classifier"
path = "models/marqo-nsfw-384.onnx"
size = 384
resize = "shorter_side_crop"
filter = "bicubic"
pixel_range = "unit"
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]
softmax = true
classes = ["NSFW", "SFW"]
categories = { NSFW = "nudity" }

# SwiftFormer-XS safety classifier (3.5M params, MIT): NSFW, NSFL (gore), SFW.
# Normalization and softmax are inside the graph.
[models.owen_safety]
kind = "image_classifier"
path = "models/owen-safety-xs.onnx"
size = 224
resize = "stretch"
filter = "bilinear"
pixel_range = "byte"
classes = ["NSFL", "NSFW", "SFW"]
categories = { NSFL = "gore", NSFW = "nudity" }

# SigLIP base zero-shot (Apache-2.0). Each category is a list of English
# prompts; the best-matching prompt gives the category score. Add a
# category by adding a line, no retraining.
[models.siglip]
kind = "image_zero_shot"
vision = "models/siglip-vision-int8.onnx"
text = "models/siglip-text-int8.onnx"
tokenizer = "models/siglip-tokenizer.json"
size = 224
resize = "stretch"
filter = "bicubic"
pixel_range = "unit"
logit_scale = 4.7649970054626465
logit_bias = -12.9324369430542

# `negatives` describe what is often mistaken for a category: an image closer
# to a negative than to every prompt scores low. `shift` moves the decision
# boundary to a score of 0.5. Both were tuned on the bundled corpus and on
# 985 real party photos and event posters, so that about 1 in 200 of them
# scores 0.5 or more in any one category (checked on 926 other ones).
# Re-measure on your own content.
[models.siglip.concepts]
weapon = { shift = 10.0, prompts = [
  "a photo of a gun",
  "a photo of a handgun",
  "a photo of a rifle",
], negatives = [
  "a photo of a knife",
  "a photo of a person holding a microphone",
] }
knife = { shift = 8.7, prompts = [
  "a photo of a knife",
], negatives = [
  "a photo of a person",
] }
drugs = { shift = 5.4, prompts = [
  "a photo of drugs",
  "a photo of pills and white powder",
  "a photo of a syringe",
  "a photo of a line of cocaine",
  "a photo of cocaine",
], negatives = [
  "a photo of cannabis",
] }
cannabis = { shift = 9.3, prompts = [
  "a photo of cannabis",
  "a photo of a marijuana joint",
  "a photo of a cannabis leaf",
], negatives = [
  "a photo of a person",
] }
alcohol = { shift = 8.7, prompts = [
  "a photo of a bottle of beer",
  "a photo of a glass of wine",
  "a photo of a cocktail",
  "a photo of bottles of liquor",
], negatives = [
  "a photo of people dancing in a nightclub",
  "a photo of a glass of water",
  "a photo of coffee",
] }
smoking = { shift = 3.0, prompts = [
  "a photo of a person smoking a cigarette",
  "a photo of cigarettes",
  "a photo of a cigar",
] }
underwear = { shift = 5.3, prompts = [
  "a photo of a woman in lingerie",
  "a photo of a person in underwear",
  "a photo of a man in his underwear",
], negatives = [
  "a photo of a shirtless man at a party",
  "a photo of a person in a swimsuit",
] }
swimwear = { shift = 0.8, prompts = [
  "a photo of a woman in a bikini",
  "a photo of a person in a swimsuit",
  "a photo of a man in swim trunks",
], negatives = [
  "a photo of a woman in lingerie",
  "a photo of a person in underwear",
] }
suggestive = { shift = 3.0, prompts = [
  "a photo of a person in lingerie",
  "a photo of a person in a bikini",
  "a sexy photo",
], negatives = [
  "a photo of a shirtless man at a party",
  "a photo of people dancing in a nightclub",
] }
hate_symbol = { shift = 3.7, prompts = [
  "a photo of a nazi swastika flag",
  "a photo of ku klux klan members in white robes",
  "a photo of a nazi salute",
  "a photo of a confederate flag",
] }
offensive_gesture = { shift = 10.8, prompts = [
  "a photo of a hand showing the middle finger",
  "a photo of a middle finger",
], negatives = [
  "a photo of a person",
] }
violence = { shift = 2.1, prompts = [
  "a photo of people fighting",
  "a photo of a violent assault",
  "a photo of a riot",
], negatives = [
  "a photo of people dancing at a party",
] }
gore = { shift = 9.0, prompts = [
  "a photo of a bloody wound",
  "a photo of a gunshot wound",
], negatives = [
  "a photo of a person",
  "a photo of a person in red light",
] }
self_harm = { shift = 5.9, prompts = [
  "a photo of scars from self-harm on a forearm",
  "a photo of self-harm cuts on an arm",
  "a photo of a razor blade and blood",
] }
minor = { shift = 4.3, prompts = [
  "a photo of kids",
  "a photo of children playing",
  "a photo of a schoolboy",
  "a photo of a schoolgirl",
  "a photo of a family with children",
], negatives = [
  "a photo of a young man",
  "a photo of a DJ",
] }

# GLiGuard (GLiNER2-Guardrails-PII-Multi, mDeBERTa-v3, Apache-2.0): reads the
# task and label names, so labels can be edited without retraining. The
# embedding is quantized to 4 bits, the rest stays fp32 (4-bit matmuls cost
# too much accuracy on this encoder).
[models.gliguard]
kind = "text_classifier"
path = "models/gliguard-emb4.onnx"
tokenizer = "models/gliguard-tokenizer.json"

[[models.gliguard.tasks]]
name = "prompt_safety"
labels = ["safe", "unsafe"]
categories = { unsafe = "text_unsafe" }

[[models.gliguard.tasks]]
name = "prompt_toxicity"
multi_label = true
labels = [
  "violence_and_weapons", "non_violent_crime", "sexual_content", "hate_and_discrimination",
  "self_harm_and_suicide", "pii_exposure", "misinformation", "copyright_violation", "child_safety",
  "political_manipulation", "unethical_conduct", "regulated_advice", "privacy_violation", "other", "benign",
]
categories = { violence_and_weapons = "violence", non_violent_crime = "illegal", sexual_content = "sexual", hate_and_discrimination = "hate", self_harm_and_suicide = "self_harm", pii_exposure = "pii", misinformation = "misinformation", copyright_violation = "copyright", child_safety = "child_safety", political_manipulation = "political", unethical_conduct = "unethical", regulated_advice = "regulated_advice", privacy_violation = "privacy" }

# Qwen3Guard-Gen 0.6B (Apache-2.0), multilingual, exported to ONNX with its
# prompt head precomputed and weights quantized to 4 bits. Second opinion:
# it runs only when GLiGuard sees some risk (`text_unsafe` >= 0.2) and its
# scores are averaged with GLiGuard's, which removes many confident mistakes
# of either model. Delete this block for 4x faster text checks and about
# 650 MB less memory, at the cost of recall (see README).
[models.qwen3guard]
kind = "text_guard"
path = "models/qwen3guard-q4.onnx"
tokenizer = "models/qwen3guard-tokenizer.json"
second_opinion = { category = "text_unsafe", low = 0.2, high = 1.0 }

# PP-OCRv5 mobile (Apache-2.0): reads the text of an image. That text goes
# through everything a text goes through, and each category comes back with
# a `text_` prefix: `text_link_adult`, `text_extremism`, `text_pii_phone`
# (`text_unsafe` keeps its name). About 0.2 s per photo, 0.5 s per poster.
[models.ocr]
kind = "image_ocr"
detector = "models/ppocrv5-mobile-det.onnx"
recognizer = "models/ppocrv5-latin-rec.onnx"
dictionary = "models/ppocrv5-latin-rec.yml"
max_side = 960
min_score = 0.5

# Reads the QR codes of an image. What they hold goes through the text rules
# and the domain lists, and comes back with a `qr_` prefix
# (`qr_link_gambling`); `qr_code` scores any code at all.
[models.qr]
kind = "qr_reader"

# HaGeZi's DNS blocklists (GPL-3.0), downloaded with the models and
# refreshed every `lists_refresh_hours`. A link to a listed site scores the
# list's category, in texts and in what the readers above find in images.
# The Public Suffix List (MPL-2.0) keeps a listed public suffix, such as a
# dynamic DNS provider, from covering the sites of its users. `allow` names
# domains a list is wrong about: they and their subdomains are never flagged.
[models.adult_sites]
kind = "domain_list"
paths = ["lists/hagezi-nsfw.txt"]
public_suffixes = "lists/public_suffix_list.dat"
category = "link_adult"

[models.gambling_sites]
kind = "domain_list"
paths = ["lists/hagezi-gambling.txt"]
public_suffixes = "lists/public_suffix_list.dat"
category = "link_gambling"
allow = []

# Malware, phishing and scam sites: HaGeZi's Threat Intelligence Feeds.
[models.unsafe_sites]
kind = "domain_list"
paths = ["lists/hagezi-tif.txt"]
public_suffixes = "lists/public_suffix_list.dat"
category = "link_unsafe"

# How the scores several models give one category combine: "max" (the
# default) lets any model flag on its own, "mean" makes them agree. Nudity
# takes the mean of Marqo and Owen: on real party photos, each one alone
# flagged shirtless dancers and pink posters the other let through.
[combine]
nudity = "mean"

# ------------------------------------------------------------- workflows
# Only the models that score a category listed in the workflow run.

[workflows.default.image]
nudity = { reject = 0.8, review = 0.5 }
gore = { reject = 0.8, review = 0.5 }
weapon = { reject = 0.8, review = 0.5 }
hate_symbol = { reject = 0.8, review = 0.5 }
self_harm = { reject = 0.8, review = 0.5 }
drugs = { review = 0.5 }
minor = { review = 0.5 }
# What the text of an image and its QR codes say. Rule and list hits score 1.
text_extremism = { reject = 1.0 }
text_link_adult = { reject = 1.0 }
text_link_unsafe = { reject = 1.0 }
text_link_gambling = { review = 1.0 }
qr_link_adult = { reject = 1.0 }
qr_link_unsafe = { reject = 1.0 }
qr_link_gambling = { review = 1.0 }

[workflows.default.text]
# `text_unsafe` is the overall verdict; a category never scores above it, so
# the categories name the reason without flagging anything on their own.
text_unsafe = { reject = 0.8, review = 0.5 }
violence = { reject = 0.8, review = 0.5 }
sexual = { reject = 0.8, review = 0.5 }
hate = { reject = 0.8, review = 0.5 }
illegal = { reject = 0.8, review = 0.5 }
unethical = { reject = 0.8, review = 0.5 }
self_harm = { review = 0.5 }
pii_email = { review = 1.0 }
pii_phone = { review = 1.0 }
pii_iban = { reject = 1.0 }
pii_card = { reject = 1.0 }
messaging_handoff = { review = 1.0 }
spam = { review = 1.0 }
scam = { review = 1.0 }
extremism = { review = 1.0 }
link_adult = { review = 1.0 }
link_gambling = { review = 1.0 }
link_unsafe = { reject = 1.0 }

# A nudity-only workflow, e.g. for profile pictures.
[workflows.nudity_only.image]
nudity = { reject = 0.8, review = 0.5 }

# Everything openmod can check, strict.
[workflows.strict.image]
nudity = { reject = 0.6, review = 0.4 }
underwear = { reject = 0.6, review = 0.4 }
swimwear = { review = 0.5 }
suggestive = { review = 0.5 }
gore = { reject = 0.6, review = 0.4 }
violence = { reject = 0.6, review = 0.4 }
self_harm = { reject = 0.6, review = 0.4 }
weapon = { reject = 0.6, review = 0.4 }
knife = { review = 0.5 }
drugs = { reject = 0.6, review = 0.4 }
cannabis = { review = 0.5 }
alcohol = { review = 0.5 }
smoking = { review = 0.5 }
hate_symbol = { reject = 0.6, review = 0.4 }
offensive_gesture = { review = 0.5 }
minor = { review = 0.4 }
# What is written on the image goes through the text models too, and only
# ever to review: the OCR reads a poster out of context, where a DJ name
# or a party title can read like a threat.
text_unsafe = { review = 0.6 }
text_violence = { review = 0.6 }
text_sexual = { review = 0.6 }
text_hate = { review = 0.6 }
text_illegal = { review = 0.6 }
text_unethical = { review = 0.6 }
text_self_harm = { review = 0.6 }
text_extremism = { reject = 1.0 }
text_link_adult = { reject = 1.0 }
text_link_gambling = { reject = 1.0 }
text_link_unsafe = { reject = 1.0 }
text_profanity = { review = 1.0 }
text_pii_phone = { review = 1.0 }
text_pii_email = { review = 1.0 }
text_pii_iban = { reject = 1.0 }
text_pii_card = { reject = 1.0 }
text_messaging_handoff = { review = 1.0 }
text_scam = { review = 1.0 }
qr_link_adult = { reject = 1.0 }
qr_link_gambling = { reject = 1.0 }
qr_link_unsafe = { reject = 1.0 }
qr_code = { review = 1.0 }

[workflows.strict.text]
text_unsafe = { reject = 0.6, review = 0.4 }
violence = { reject = 0.6, review = 0.4 }
sexual = { reject = 0.6, review = 0.4 }
hate = { reject = 0.6, review = 0.4 }
